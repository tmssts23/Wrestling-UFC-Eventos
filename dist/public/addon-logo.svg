<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-label="Wrestling e UFC">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1b2333"/>
      <stop offset="100%" stop-color="#0b0e14"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f6d365"/>
      <stop offset="55%" stop-color="#d7a13b"/>
      <stop offset="100%" stop-color="#9a6b18"/>
    </linearGradient>
  </defs>

  <rect width="256" height="256" rx="46" fill="url(#bg)"/>

  <!-- octogono (MMA) -->
  <polygon points="128,36 186,60 210,118 186,176 128,200 70,176 46,118 70,60"
