  <!-- placa central do cinturao -->
  <path d="M128 70 c26 0 48 12 48 12 v30 c0 30-22 52-48 62 -26-10-48-32-48-62 V82 s22-12 48-12 z"
        fill="url(#gold)" stroke="#6d4a10" stroke-width="4"/>

  <!-- estrela simples na placa -->
  <path d="M128 96 l9 19 21 3 -15 15 4 21 -19-10 -19 10 4-21 -15-15 21-3 z"
        fill="#2a1c05" opacity="0.75"/>
</svg>
